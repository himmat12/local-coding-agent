services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    expose:
      - 11434
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/start_ollama.sh:/start_ollama.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - local_code_network
    entrypoint: ["/start_ollama.sh"]

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: local-code-agent
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./workspace:/workspace:rw
    working_dir: /app
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stdin_open: true
    tty: true
    networks:
      - local_code_network

volumes:
  ollama_data:

networks:
  local_code_network:
    driver: bridge
    internal: true  