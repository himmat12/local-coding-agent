services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - 11434:11434
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/start_ollama.sh:/start_ollama.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=0.0.0.0
        # - CUDA_VISIBLE_DEVICES=0  # Prioritizes GPU 0 exclusively for container
      - OLLAMA_CONTEXT_LENGTH=2048  # Safe for 4GB
        # - OLLAMA_FLASH_ATTENTION=false  # Avoids allocation crashes
      - OLLAMA_NUM_PARALLEL=1  # Single model load
      - OLLAMA_MAX_LOADED_MODELS=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]  # Lock to GPU 0
              capabilities: [gpu]
    networks:
      - local_code_network
    
    entrypoint: ["/start_ollama.sh"]

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: local-code-agent
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./workspace:/workspace:rw
    working_dir: /app
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stdin_open: true
    tty: true
    networks:
      - local_code_network
    labels:
      - com.centurylinklabs.watchtower.enable=true
      
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --interval 300

volumes:
  ollama_data:

networks:
  local_code_network:
    driver: bridge
